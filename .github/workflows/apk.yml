name: APK de teste

# Gera um APK de qualquer branch sem precisar de merge:
# Actions > "APK de teste" > Run workflow > escolher a branch.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Test core and build debug APK
        run: ./gradlew :core:test :app:assembleDebug

      - name: Publish test release for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SLUG=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          TAG="test-${SLUG}"
          APK="RoverQuestMR-${SLUG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          # One test release per branch, replaced on every build.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
            --title "${BRANCH} (teste)" \
            --notes "APK de teste da branch \`${BRANCH}\` (commit ${GITHUB_SHA::7}). Substituído a cada novo build desta branch."
          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/${APK}"
          {
            echo "## 📱 APK de teste: \`${BRANCH}\`"
            echo
            echo "**[Baixar ${APK}](${URL})** (commit ${GITHUB_SHA::7})"
            echo
            echo "O mesmo link sempre aponta para o build mais recente desta branch."
          } >> "$GITHUB_STEP_SUMMARY"
