name: CI

on:
  # Runs on every PR: `build` is a required check on main, so it must always report.
  pull_request:
    branches: [main]
  # Every merge to main publishes a release with the APK, even for docs-only changes.
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Test core and build debug APK
        run: ./gradlew :core:test :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverquest-debug-apk
          path: game/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Zero-padded so GitHub lists releases in build order (it sorts tags as text).
          BUILD=$(printf '%04d' "$GITHUB_RUN_NUMBER")
          TAG="v${VERSION}-build.${BUILD}"
          APK="RoverQuestMR-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "RoverQuest MR $TAG" --generate-notes --latest

      - name: Publish README CI badge
        # Runs after failures too, so the badge on main always shows the real status.
        if: always() && github.event_name == 'push'
        working-directory: .
        env:
          STATUS: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(mktemp -d)
          .github/scripts/ci-badge.sh "$STATUS" "$OUT/ci.svg"
          cd "$OUT"
          # Orphan branch holding only the badge, replaced on every run.
          git init -q -b badges
          git add ci.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "CI badge: $STATUS"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
